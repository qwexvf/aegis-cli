      #   if: failure()
      #   run: |
      #     curl -sSX POST "$SLACK_WEBHOOK_URL" \
      #       -H 'Content-type: application/json' \
      #       --data '{"text":"aegis rescan found new advisories in ${{ github.repository }}"}'
      #   env:
      #     SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
