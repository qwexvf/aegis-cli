# Example GitLab CI job for aegis CI audit.
#
# Drop this snippet into your .gitlab-ci.yml. Adjust the `before_script`
# for your package manager.
#
# Behavior matches the GitHub Actions example:
#   - Installs deps, then runs `aegis ci --fail-on=block`
#   - Job fails (non-zero exit) on BLOCK-verdict findings
#   - Caches ~/.aegis between runs so warm runs are seconds

aegis-audit:
  image: oven/bun:1
  variables:
    AEGIS_API_URL: "http://aegis.internal:4000"   # adjust or unset
  cache:
    key:
      files:
        - bun.lock
        - package-lock.json
        - yarn.lock
        - pnpm-lock.yaml
    paths:
      - .aegis-cache/
  before_script:
    # ---------- 1. Install your project's dependencies ----------
    - bun install --frozen-lockfile

    # ---------- 2. Install aegis (build from source for now) ----
    # Switch to release-binary download once available:
    #   - apk add --no-cache curl
    #   - curl -sSL https://github.com/qwexvf/aegis/releases/latest/download/aegis-linux-amd64 \
    #       -o /usr/local/bin/aegis && chmod +x /usr/local/bin/aegis
    - apk add --no-cache go git make gcc musl-dev
    - git clone --depth=1 https://github.com/qwexvf/aegis /tmp/aegis
    - cd /tmp/aegis/services/cli && make build
    - mv bin/aegis /usr/local/bin/aegis
    - cd $CI_PROJECT_DIR

    # ---------- 3. Wire the cache into AEGIS_CACHE_DIR ----------
    - export AEGIS_CACHE_DIR="$CI_PROJECT_DIR/.aegis-cache"
    - mkdir -p "$AEGIS_CACHE_DIR"

  script:
    - aegis ci --fail-on=block

  # Capture the JSON report for review even on pass/fail.
  after_script:
    - aegis ci --fail-on=block --json > aegis-report.json || true
  artifacts:
    when: always
    paths:
      - aegis-report.json
    expire_in: 14 days
