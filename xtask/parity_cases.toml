# Golden-output parity cases. Each case runs the `aegis` binary with `args`
# and structurally diffs its --json against `golden`.
#
# Goldens under examples/ are Rust-candidate baselines until replaced with
# output captured from the reference Go binary (aegis v0.29). Add cases as
# each command's corpus lands; a phase is "parity-done" when its cases are
# green against Go-captured goldens.

# parse: fully offline + deterministic (no network), so these are the first
# real parity cases.
[[case]]
name = "parse-npm-lock"
args = ["parse", "examples/parse/package-lock.json", "--json"]
golden = "examples/parse/package-lock.golden.json"

[[case]]
name = "parse-cargo-lock"
args = ["parse", "examples/parse/Cargo.lock", "--json"]
golden = "examples/parse/Cargo.golden.json"

# allowlist / explain emit static, deterministic tables — good regression
# guards for the built-in capability rules and risk model.
[[case]]
name = "allowlist"
args = ["allowlist", "--json"]
golden = "examples/static/allowlist.golden.json"

[[case]]
name = "explain"
args = ["explain", "--json"]
golden = "examples/static/explain.golden.json"
