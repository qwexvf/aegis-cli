name: supply-chain daily rescan

# Re-query OSV against the saved aegis.lock snapshot without re-running
# the full AST scan. Catches newly-disclosed CVEs on existing deps.
# The push/PR self-audit runs inside ci.yml as the "supply-chain" job.

on:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  rescan:
    name: retroactive CVE rescan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version: "1.26.4"
          cache: true

      - name: build aegis
        run: make build-release

      - name: restore aegis snapshot cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.aegis
          key: aegis-self-${{ runner.os }}-
          restore-keys: aegis-self-${{ runner.os }}-

      # Exits 1 if any dep has a newly-disclosed advisory since last enrich.
      - name: snapshot rescan
        run: ./bin/aegis snapshot rescan
