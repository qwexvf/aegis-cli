name: release-please

# Conventional-commit-driven release automation.
#
# Flow:
#   1. Every push to main triggers this workflow.
#   2. release-please scans commits since the last release and either:
#      - opens / updates a "release-PR" with a CHANGELOG entry and
#        a version bump derived from commit prefixes (feat: → minor,
#        fix: → patch, feat!: / BREAKING CHANGE → major), OR
#      - creates the release tag if the previous release-PR was just
#        merged. The tag (vX.Y.Z) then triggers release.yml below,
#        which runs goreleaser to publish the binaries.
#
# All version state lives in .release-please-manifest.json and
# release-please-config.json — release-please owns those files; humans
# only edit them to seed the initial version or change the policy.
#
# Why a PAT, not GITHUB_TOKEN: tags and releases created with
# GITHUB_TOKEN do NOT trigger downstream `push` or `release` workflows
# (anti-loop policy in Actions). That left release.yml — the
# goreleaser pipeline — silently skipped on every release-please cut.
# The fix is to give release-please a token tied to a real user, so
# the tag push looks like a human action and downstream workflows fire.
#
# Required setup (one-time):
#   1. Generate a fine-grained PAT scoped to this repo with:
#        - Contents:      read + write
#        - Pull requests: read + write
#   2. Add it as a repo secret named RELEASE_PLEASE_PAT.

on:
  push:
    branches: [main]

permissions:
  contents: write          # create tags, GitHub releases
  pull-requests: write     # open / update release-PR

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
