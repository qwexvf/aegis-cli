name: release-please

# Conventional-commit-driven release automation.
#
# Flow:
#   1. Every push to main triggers this workflow.
#   2. release-please scans commits since the last release and either:
#      - opens / updates a "release-PR" with a CHANGELOG entry and
#        a version bump derived from commit prefixes (feat: → minor,
#        fix: → patch, feat!: / BREAKING CHANGE → major), OR
#      - creates the release tag if the previous release-PR was just
#        merged. The tag (vX.Y.Z) then triggers release.yml below,
#        which runs goreleaser to publish the binaries.
#
# All version state lives in .release-please-manifest.json and
# release-please-config.json — release-please owns those files; humans
# only edit them to seed the initial version or change the policy.
#
# Known limitation (tracked in #28): tags created with GITHUB_TOKEN
# don't trigger downstream `push` or `release` workflows (Actions
# anti-loop guard). That means release.yml — the goreleaser pipeline —
# does NOT fire automatically when this workflow merges a release-PR.
# The current workaround is the manual re-tag ritual:
#
#   gh release delete vX.Y.Z --cleanup-tag --yes
#   git tag vX.Y.Z <sha>
#   git push origin vX.Y.Z
#
# The clean fix is a PAT (or GitHub App token) — see #28 for the
# wiring. Switch over when release cadence makes the manual step
# annoying enough to justify the secret.

on:
  push:
    branches: [main]

permissions:
  contents: write          # create tags, GitHub releases
  pull-requests: write     # open / update release-PR

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
