name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write       # publish release + assets
  id-token: write       # cosign keyless OIDC + attestation OIDC
  attestations: write   # SLSA build provenance attestations

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # zig provides the cross-cgo C toolchain (linux/darwin/windows × amd64/arm64)
      # so a single ubuntu runner can produce every cgo build flavour.
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - uses: sigstore/cosign-installer@v3

      - uses: anchore/sbom-action/download-syft@v0

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SLSA build provenance over every release artifact + checksum file.
      # Verifiable later via `gh attestation verify <file> --owner qwexvf`.
      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
