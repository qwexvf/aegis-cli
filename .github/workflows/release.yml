name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write       # publish release + assets
  id-token: write       # cosign keyless OIDC + attestation OIDC
  attestations: write   # SLSA build provenance attestations

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      # zig provides the cross-cgo C toolchain (linux/darwin/windows × amd64/arm64)
      # so a single ubuntu runner can produce every cgo build flavour.
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - uses: sigstore/cosign-installer@v3

      - uses: anchore/sbom-action/download-syft@v0

      # Extract this tag's section from CHANGELOG.md so the GitHub
      # release body shows the curated notes instead of the
      # auto-generated commit list. Falls back to auto-generated
      # notes when the section is missing.
      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if bash scripts/extract-changelog.sh "$tag" > /tmp/release-notes.md && [[ -s /tmp/release-notes.md ]]; then
            echo "Found CHANGELOG.md section for $tag ($(wc -l < /tmp/release-notes.md) lines)"
            echo "notes_arg=--release-notes=/tmp/release-notes.md" >> "$GITHUB_OUTPUT"
          else
            echo "No CHANGELOG.md section for $tag — falling back to auto-generated notes"
            echo "notes_arg=" >> "$GITHUB_OUTPUT"
          fi

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean ${{ steps.notes.outputs.notes_arg }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SLSA build provenance over every release artifact + checksum file.
      # Verifiable later via `gh attestation verify <file> --owner qwexvf`.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
