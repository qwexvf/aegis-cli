name: release

# Cut a release: `git tag v0.X.Y && git push origin v0.X.Y`.
# Goreleaser auto-generates the changelog from conventional-commit
# messages (see the `changelog:` block in .goreleaser.yaml).
on:
  push:
    tags:
      - 'v*'

# Same tag re-pushed (e.g. force-update during a rocky release) cancels
# nothing — let both runs finish so we can pick the green one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write       # publish release + assets
  id-token: write       # cosign keyless OIDC + attestation OIDC
  attestations: write   # SLSA build provenance attestations

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache: true

      - uses: sigstore/cosign-installer@v3

      - uses: anchore/sbom-action/download-syft@v0

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SLSA build provenance over every release artifact + checksum file.
      # Verifiable later via `gh attestation verify <file> --owner qwexvf`.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
