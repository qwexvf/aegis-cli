name: release

# Cut a release: `git tag v0.X.Y && git push origin v0.X.Y`.
# Goreleaser auto-generates the changelog from conventional-commit
# messages (see the `changelog:` block in .goreleaser.yaml).
on:
  push:
    tags:
      - 'v*'

# Same tag re-pushed (e.g. force-update during a rocky release) cancels
# nothing — let both runs finish so we can pick the green one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write       # publish release + assets
  id-token: write       # cosign keyless OIDC + attestation OIDC
  attestations: write   # SLSA build provenance attestations

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version: "1.26.3"
          cache: true

      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9  # v3

      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610  # v0

      - uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89  # v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SLSA build provenance over every release artifact + checksum file.
      # Verifiable later via `gh attestation verify <file> --owner qwexvf`.
      - uses: actions/attest-build-provenance@b3e506e8c389afc651c5bacf2b8f2a1ea0557215  # v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
