name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: go test -race
        run: go test -race ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      # Install from source so the linter binary is compiled with the
      # same Go toolchain as the project. The pre-built golangci-lint
      # release binaries currently target Go 1.24 and refuse to lint
      # code declaring `go 1.26` in go.mod.
      - name: install golangci-lint (from source, via local Go)
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - name: golangci-lint run
        run: golangci-lint run --timeout=5m

  build-matrix:
    name: build-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: make build-release build-core build-each-pm
        run: |
          make build-release
          make build-core
          make build-npm build-bun build-yarn build-pnpm
      - name: smoke — every binary prints --version
        run: |
          set -euo pipefail
          for b in aegis aegis-core aegis-npm aegis-bun aegis-yarn aegis-pnpm; do
            echo "::group::$b version"
            ./bin/"$b" version
            echo "::endgroup::"
          done

  goreleaser-check:
    name: goreleaser check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: check
