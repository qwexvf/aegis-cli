name: ci

on:
  push:
    branches: [main, "port/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: format
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  lean-build:
    # Guards the lean-build promise: each feature-gated crate must compile with
    # default features OFF and only a minimal feature set on — so a leaked
    # optional dep or a missing `#[cfg(feature = ...)]` is caught here, not by a
    # downstream consumer trying to build lean. Covers the zero-feature floor
    # plus each feature that pulls an optional dep (regex / quick-xml / grammars
    # / tree-sitter) in isolation.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: lean feature builds
        run: |
          set -euxo pipefail
          # lockfile: zero ecosystems, a pure one, and the optional-dep ones.
          cargo build -p aegis-lockfile --no-default-features
          cargo build -p aegis-lockfile --no-default-features --features npm
          cargo build -p aegis-lockfile --no-default-features --features maven
          cargo build -p aegis-lockfile --no-default-features --features hex
          # ast grammars: zero, one native, and the ruby-reuse (cocoapods).
          cargo build -p aegis-ast --no-default-features
          cargo build -p aegis-ast --no-default-features --features js
          cargo build -p aegis-ast --no-default-features --features cocoapods
          # heuristics: zero, and each optional-dep detector in isolation.
          cargo build -p aegis-heuristics --no-default-features
          cargo build -p aegis-heuristics --no-default-features --features secrets
          cargo build -p aegis-heuristics --no-default-features --features install-hook
          cargo build -p aegis-heuristics --no-default-features --features maintainer
          # sbom emitters + registry fetchers.
          cargo build -p aegis-sbom --no-default-features
          cargo build -p aegis-sbom --no-default-features --features cyclonedx
          cargo build -p aegis-registry --no-default-features
          cargo build -p aegis-registry --no-default-features --features npm

  parity:
    # Analyze-command parity gate. Diffs the Rust binary against goldens
    # captured from the Go reference (aegis v0.29). Goldens are committed under
    # examples/incidents, so no Go toolchain is needed here — refresh them with
    # `cargo run -p xtask -- analyze-parity --record` when the Go binary is
    # available locally.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: analyze-parity (Rust vs Go-captured goldens)
        run: cargo run -q -p xtask -- analyze-parity
      - name: sbom-parity (Rust vs Go-captured goldens)
        run: cargo run -q -p xtask -- sbom-parity
