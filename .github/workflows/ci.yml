name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write  # SARIF upload from self-audit

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version: "1.26.4"
          cache: true
      - name: go test -race
        run: go test -race ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version: "1.26.4"
          cache: true
      # Install from source so the linter binary is compiled with the
      # same Go toolchain as the project. The pre-built golangci-lint
      # release binaries currently target Go 1.24 and refuse to lint
      # code declaring `go 1.26` in go.mod.
      - name: install golangci-lint (from source, via local Go)
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - name: golangci-lint run
        run: golangci-lint run --timeout=5m

  build-matrix:
    name: build-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version: "1.26.4"
          cache: true
      - name: build aegis
        run: make build-release
      - name: smoke — binary prints --version
        run: ./bin/aegis version

      - name: e2e — analyze every fixture in examples/incidents/
        run: AEGIS=./bin/aegis AEGIS_SKIP_BUILD=1 bash tests/e2e/incidents.sh

  goreleaser-check:
    name: goreleaser check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version: "1.26.4"
          cache: true
      - uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89  # v7
        with:
          version: latest
          args: check

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version: "1.26.4"
          cache: true
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: scan for known vulnerabilities
        run: govulncheck ./...

  sbom-validate:
    name: sbom validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version: "1.26.4"
          cache: true
      - name: build aegis
        run: make build-release
      - name: generate SBOMs from examples/demo
        working-directory: examples/demo
        run: |
          ../../bin/aegis snapshot save
          ../../bin/aegis sbom -o /tmp/aegis-demo-1.5.cdx.json
          ../../bin/aegis sbom --cdx-version=1.6 -o /tmp/aegis-demo-1.6.cdx.json
      - name: install cyclonedx-cli
        run: |
          curl -sSL https://github.com/CycloneDX/cyclonedx-cli/releases/latest/download/cyclonedx-linux-x64 \
            -o /usr/local/bin/cyclonedx
          chmod +x /usr/local/bin/cyclonedx
      - name: validate CycloneDX 1.5 schema
        run: cyclonedx validate --input-file /tmp/aegis-demo-1.5.cdx.json --input-version v1_5 --fail-on-errors
      - name: validate CycloneDX 1.6 schema
        run: cyclonedx validate --input-file /tmp/aegis-demo-1.6.cdx.json --input-version v1_6 --fail-on-errors

  supply-chain:
    name: supply-chain self-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version: "1.26.4"
          cache: true

      # Build from source — scan with the exact binary under test.
      - name: build aegis
        run: make build-release

      # Cache AST + CVE results; invalidated when go.sum changes.
      - name: cache aegis data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.aegis
          key: aegis-self-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: aegis-self-${{ runner.os }}-

      - name: snapshot save
        run: ./bin/aegis snapshot save

      - name: snapshot enrich
        run: ./bin/aegis snapshot enrich

      # Deps gate + Actions workflow scan in one pass.
      - name: aegis ci gate
        run: |
          ./bin/aegis ci \
            --fail-on=block \
            --scan-actions \
            --sarif > aegis-self.sarif

      - name: upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@52485aec7be33610227643b0fe83936b8b5f061a  # v3
        with:
          sarif_file: aegis-self.sarif
          category: aegis-self-audit

  ci:
    name: ci
    if: always()
    needs:
      - test
      - lint
      - build-matrix
      - goreleaser-check
      - govulncheck
      - sbom-validate
      - supply-chain
    runs-on: ubuntu-latest
    steps:
      - name: aggregate
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "one or more required jobs failed"
            exit 1
          fi
          echo "all required jobs passed"
