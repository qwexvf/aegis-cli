name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache: true
      - name: go test -race
        run: go test -race ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache: true
      # Install from source so the linter binary is compiled with the
      # same Go toolchain as the project. The pre-built golangci-lint
      # release binaries currently target Go 1.24 and refuse to lint
      # code declaring `go 1.26` in go.mod.
      - name: install golangci-lint (from source, via local Go)
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - name: golangci-lint run
        run: golangci-lint run --timeout=5m

  build-matrix:
    name: build-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache: true
      - name: build aegis + aegis-core
        run: |
          make build-release
          make build-core
      - name: smoke — every binary prints --version
        run: |
          set -euo pipefail
          for b in aegis aegis-core; do
            echo "::group::$b version"
            ./bin/"$b" version
            echo "::endgroup::"
          done

      - name: e2e — analyze every fixture in examples/incidents/
        run: AEGIS=./bin/aegis AEGIS_SKIP_BUILD=1 bash tests/e2e/incidents.sh

  goreleaser-check:
    name: goreleaser check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: check

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache: true
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: scan for known vulnerabilities
        run: govulncheck ./...

  ci:
    name: ci
    if: always()
    needs:
      - test
      - lint
      - build-matrix
      - goreleaser-check
      - govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: aggregate
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "one or more required jobs failed"
            exit 1
          fi
          echo "all required jobs passed"
