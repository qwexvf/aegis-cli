[package]
name = "aegis-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "HTTP transport abstraction for aegis — a blocking HttpClient trait with a ureq backend and an in-memory mock."

[dependencies]
# Blocking, pure-Rust HTTP — fits a CLI (no async runtime, small binary).
# Optional so a build can swap the transport or drop it entirely.
ureq = { version = "3", optional = true }
# Cassette record/replay only — kept optional so the lean-build floor stays dep-free.
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
base64 = { version = "0.23", optional = true }

[features]
default = ["ureq-backend"]
ureq-backend = ["dep:ureq"]
# Deterministic offline HTTP for the ci-parity gate (record + replay transports).
cassette = ["dep:serde", "dep:serde_json", "dep:base64"]
