[package]
name = "aegis-sbom"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "SBOM generation (CycloneDX / SPDX / PURL) for the aegis supply-chain scanner."

[dependencies]
aegis-domain = { path = "../aegis-domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["cyclonedx", "spdx", "sarif"]
# PURL builder is always compiled (tiny, dependency-free); the document emitters
# (CycloneDX, SPDX, SARIF) are each behind their own feature.
cyclonedx = []
spdx = []
sarif = []
