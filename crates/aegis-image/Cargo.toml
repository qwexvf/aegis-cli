[package]
name = "aegis-image"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "OCI / Docker container-image supply-chain scanning (layer overlay + first-slice risk checks)."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure-Rust tar + gzip readers for `docker save` / OCI-layout tarballs.
tar = "0.4"
flate2 = "1"
# Source-pattern heuristics for the deeper scan pass. Only the source-pattern
# detector is needed here, so pull it in without the rest of the default set.
aegis-domain = { path = "../aegis-domain" }
aegis-heuristics = { path = "../aegis-heuristics", default-features = false, features = ["source-patterns"] }
# Tree-sitter AST capability scanner for the per-file AST pass. Default
# features pull in every compiled-in grammar so we can pick a scanner by
# extension for any source file the image ships.
aegis-ast = { path = "../aegis-ast" }
