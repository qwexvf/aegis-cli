[package]
name = "aegis-ast"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "AST capability scanner (tree-sitter, native — no CGO) for the aegis supply-chain scanner."

[dependencies]
aegis-domain = { path = "../aegis-domain" }
tree-sitter = "0.25"
streaming-iterator = "0.1"
# Each grammar is an optional dependency behind a per-language feature —
# grammars are large, so this is the biggest binary-size lever. Native
# Rust crates: no C toolchain / CGO required (the whole point of Phase 5).
tree-sitter-javascript = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-ruby = { version = "0.23", optional = true }
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.23", optional = true }
tree-sitter-php = { version = "0.23", optional = true }
tree-sitter-c-sharp = { version = "0.23", optional = true }
tree-sitter-haskell = { version = "0.23", optional = true }
tree-sitter-lua = { version = "0.2", optional = true }
tree-sitter-gleam = { version = "1", optional = true }
tree-sitter-dart = { version = "0.2", optional = true }

[features]
default = ["js", "py", "ruby", "rust", "go", "php", "csharp", "haskell", "lua", "gleam", "dart", "cocoapods"]
js = ["dep:tree-sitter-javascript"]
py = ["dep:tree-sitter-python"]
ruby = ["dep:tree-sitter-ruby"]
rust = ["dep:tree-sitter-rust"]
go = ["dep:tree-sitter-go"]
php = ["dep:tree-sitter-php"]
csharp = ["dep:tree-sitter-c-sharp"]
haskell = ["dep:tree-sitter-haskell"]
lua = ["dep:tree-sitter-lua"]
gleam = ["dep:tree-sitter-gleam"]
dart = ["dep:tree-sitter-dart"]
# CocoaPods podspecs are Ruby — reuse the Ruby grammar with a podspec query.
cocoapods = ["dep:tree-sitter-ruby"]
