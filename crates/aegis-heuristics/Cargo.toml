[package]
name = "aegis-heuristics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Behavioral supply-chain heuristics (hardcoded secrets, typosquats, …) for the aegis scanner."

[dependencies]
aegis-domain = { path = "../aegis-domain" }
# regex is needed by the secret-pattern detector; optional so a
# typosquat-only build stays lean.
regex = { version = "1", optional = true }
# serde_json parses package manifests for the metadata detectors (vcs-dep);
# optional so a source-scan-only build stays lean.
serde_json = { version = "1", optional = true }
# semver compares go.mod retract ranges against the installed version.
semver = { version = "1", optional = true }
# time parses registry RFC3339 publish timestamps for the maintainer detector.
time = { version = "0.3", features = ["parsing", "formatting"], optional = true }

[features]
default = ["secrets", "typosquat", "source-patterns", "binary-dropper", "vcs-dep", "install-hook", "unlisted-payload", "go-retract", "maintainer", "tarball-drift"]
binary-dropper = []
secrets = ["dep:regex"]
typosquat = []
source-patterns = ["dep:regex"]
vcs-dep = ["dep:serde_json"]
install-hook = ["dep:regex", "dep:serde_json"]
unlisted-payload = ["dep:serde_json"]
go-retract = ["dep:regex", "dep:semver"]
maintainer = ["dep:time"]
tarball-drift = ["dep:serde_json"]
