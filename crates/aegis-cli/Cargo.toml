[package]
name = "aegis-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The aegis supply-chain scanner CLI (Rust port)."

[[bin]]
name = "aegis"
path = "src/main.rs"

[dependencies]
aegis-domain = { path = "../aegis-domain" }
aegis-lockfile = { path = "../aegis-lockfile" }
aegis-ast = { path = "../aegis-ast" }
aegis-heuristics = { path = "../aegis-heuristics" }
aegis-vuln = { path = "../aegis-vuln" }
aegis-registry = { path = "../aegis-registry" }
aegis-sbom = { path = "../aegis-sbom" }
aegis-pkgbuild = { path = "../aegis-pkgbuild" }
aegis-image = { path = "../aegis-image" }
aegis-reach = { path = "../aegis-reach" }
aegis-net = { path = "../aegis-net", features = ["cassette"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
clap = { version = "4", features = ["derive"] }
rayon = "1"
toml = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ruzstd = "0.9.0"
tar = "0.4.46"
flate2 = "1.1.9"
clap_complete = "4.5.67"
regex = "1.13.1"
