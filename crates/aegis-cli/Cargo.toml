[package]
name = "aegis-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The aegis supply-chain scanner CLI (Rust port)."

[[bin]]
name = "aegis"
path = "src/main.rs"

[dependencies]
aegis-domain = { path = "../aegis-domain" }
aegis-lockfile = { path = "../aegis-lockfile" }
aegis-ast = { path = "../aegis-ast" }
aegis-heuristics = { path = "../aegis-heuristics" }
aegis-vuln = { path = "../aegis-vuln" }
aegis-registry = { path = "../aegis-registry" }
aegis-net = { path = "../aegis-net" }
clap = { version = "4", features = ["derive"] }
rayon = "1"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
