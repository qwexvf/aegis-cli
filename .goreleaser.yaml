# GoReleaser config for the aegis CLI.
#
# Two build flavours:
#
#   1. `aegis` (cgo, linux/amd64 only): default binary with the JS AST
#      scanner via tree-sitter cgo. Anyone on a different OS/arch who
#      wants the AST scanner installs from source with
#      `go install github.com/qwexvf/aegis-cli/cmd/aegis@latest`.
#
#   2. `aegis-core` (no-cgo, linux/darwin/windows × amd64/arm64): drops
#      the AST scanner via the `nojsscan` build tag. Pure-Go. Covers
#      every other platform.
#
# Per-pm binaries (`aegis-npm`, `aegis-bun`, …) were dropped in v0.16
# — they trimmed only 19 KB off the binary, not worth four extra
# builds + archives + cosign attestations. The build tags
# (`nonpm`, `nobun`, `noyarn`, `nopnpm`) stay around for users who
# want a smaller `go install`.
#
# Version, commit, build-date are stamped into the cli package via
# ldflags. The `version` cobra command (root.go) reads them.

version: 2

project_name: aegis-cli

before:
  hooks:
    - go mod download

builds:
  - id: aegis
    binary: aegis
    main: ./cmd/aegis
    env:
      - CGO_ENABLED=1
    goos: [linux]
    goarch: [amd64]
    ldflags: &ldflags
      - -s -w
      - -X github.com/qwexvf/aegis-cli/internal/interface/cli.Version={{ .Version }}
      - -X github.com/qwexvf/aegis-cli/internal/interface/cli.Commit={{ .Commit }}
      - -X github.com/qwexvf/aegis-cli/internal/interface/cli.Date={{ .Date }}

  - id: aegis-core
    binary: aegis-core
    main: ./cmd/aegis
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -tags=nojsscan
    ldflags: *ldflags

archives:
  - id: default
    ids: [aegis]
    formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - README.md

  - id: core
    ids: [aegis-core]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: 'aegis-core_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - README.md

# SBOMs — one per archive, generated by syft (already installed in
# release.yml via anchore/sbom-action/download-syft). Attached to the
# GitHub Release alongside the archives and checksums.
sboms:
  - id: archive-sbom
    artifacts: archive
    documents:
      - >-
        {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}.sbom.json
    cmd: syft
    args:
      - "$artifact"
      - "--output"
      - "cyclonedx-json=$document"

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: '{{ incpatch .Version }}-dev'

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^Merge'
      - '^chore\(deps\):'
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Documentation
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Other
      order: 999

# Cosign keyless OIDC signing. Signs the checksums file — verifying
# checksums.txt then verifying any artifact against it transitively
# verifies the artifact.
signs:
  - id: cosign-checksums
    cmd: cosign
    args:
      - sign-blob
      - '--yes'
      - '--output-signature=${signature}'
      - '--output-certificate=${certificate}'
      - '${artifact}'
    artifacts: checksum
    output: true
    certificate: '${artifact}.pem'
    signature: '${artifact}.sig'

release:
  github:
    owner: qwexvf
    name: aegis-cli
  draft: false
  prerelease: auto
  header: |
    # aegis-cli {{ .Tag }}

    Supply-chain security CLI for npm / bun / yarn / pnpm.

    ## Verifying releases

    All artifacts are checksummed (`checksums.txt`) and the checksums file
    is signed via cosign keyless OIDC. To verify:

    ```sh
    cosign verify-blob \
      --certificate-identity-regexp 'https://github.com/qwexvf/aegis-cli/.github/workflows/release.yml.*' \
      --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
      --certificate checksums.txt.pem \
      --signature   checksums.txt.sig \
      checksums.txt
    sha256sum -c checksums.txt
    ```

    SLSA build provenance is attached to every artifact and can be
    verified with `gh attestation verify <file> --owner qwexvf`.
  footer: |
    Apache-2.0 — see [LICENSE](https://github.com/qwexvf/aegis-cli/blob/main/LICENSE).
