# GoReleaser config for the aegis CLI.
#
# Build flavours mirror the Makefile. Two pieces of context to know:
#
#   1. The default `aegis` binary embeds the JS AST scanner (tree-sitter
#      via cgo). Cross-compiling cgo from a single linux/amd64 runner is
#      painful, so the matrix uses native-arch runners later. For now the
#      release pipeline uses zig as the cross-compiler so a single host
#      can produce all binaries — see the `env` block on each build.
#
#   2. The `nojsscan` build tag drops the AST scanner; that build does
#      not need cgo. The per-PM binaries DO still embed the scanner
#      (per Makefile docstring: "AST scanner stays on; combine with
#      nojsscan for gate-only"), so they need cgo too.
#
# Version, commit, and build-date are stamped into the cli package via
# ldflags. The `version` cobra command (root.go) reads them.

version: 2

project_name: aegis-cli

before:
  hooks:
    - go mod download

builds:
  # ---------------------------------------------------------------- #
  # Default release: full feature set, all PMs, JS AST scanner on.   #
  # ---------------------------------------------------------------- #
  - id: aegis
    binary: aegis
    main: ./cmd/aegis
    env:
      - CGO_ENABLED=1
      # Cross-arch cgo from a linux/amd64 GitHub runner: zig is the C
      # compiler. On native amd64 we let go pick the system gcc.
      - >-
        {{- if eq .Arch "arm64" -}}
        CC=zig cc -target aarch64-linux-gnu
        {{- end -}}
    # v0.1.0 ships cgo binaries for linux/amd64 + linux/arm64 only.
    # Reliable cross-cgo to darwin and windows from a linux runner
    # needs the macOS SDK / mingw headers in addition to zig; ship
    # aegis-core (no cgo) for those platforms today, and add native
    # macos-latest / windows-latest jobs in a future minor release if
    # demand justifies the CI cost. Mac users who want the AST scanner
    # can `go install github.com/qwexvf/aegis-cli/cmd/aegis@latest`.
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/qwexvf/aegis-cli/internal/interface/cli.Version={{ .Version }}
      - -X github.com/qwexvf/aegis-cli/internal/interface/cli.Commit={{ .Commit }}
      - -X github.com/qwexvf/aegis-cli/internal/interface/cli.Date={{ .Date }}

  # ---------------------------------------------------------------- #
  # Core: same binary minus the JS AST scanner. No cgo.              #
  # ---------------------------------------------------------------- #
  - id: aegis-core
    binary: aegis-core
    main: ./cmd/aegis
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -tags=nojsscan
    ldflags:
      - -s -w
      - -X github.com/qwexvf/aegis-cli/internal/interface/cli.Version={{ .Version }}
      - -X github.com/qwexvf/aegis-cli/internal/interface/cli.Commit={{ .Commit }}
      - -X github.com/qwexvf/aegis-cli/internal/interface/cli.Date={{ .Date }}

  # ---------------------------------------------------------------- #
  # Per-PM single-tool binaries. Same shape as the Makefile targets. #
  # AST scanner stays compiled in (per Makefile commentary), so cgo. #
  # ---------------------------------------------------------------- #
  - id: aegis-npm
    binary: aegis-npm
    main: ./cmd/aegis
    env:
      - CGO_ENABLED=1
      - >-
        {{- if eq .Arch "arm64" -}}
        CC=zig cc -target aarch64-linux-gnu
        {{- end -}}
    goos: [linux]
    goarch: [amd64, arm64]
    flags:
      - -tags=nobun,noyarn,nopnpm
    ldflags:
      - -s -w
      - -X github.com/qwexvf/aegis-cli/internal/interface/cli.Version={{ .Version }}
      - -X github.com/qwexvf/aegis-cli/internal/interface/cli.Commit={{ .Commit }}
      - -X github.com/qwexvf/aegis-cli/internal/interface/cli.Date={{ .Date }}

  - id: aegis-bun
    binary: aegis-bun
    main: ./cmd/aegis
    env:
      - CGO_ENABLED=1
      - >-
        {{- if eq .Arch "arm64" -}}
        CC=zig cc -target aarch64-linux-gnu
        {{- end -}}
    goos: [linux]
    goarch: [amd64, arm64]
    flags:
      - -tags=nonpm,noyarn,nopnpm
    ldflags:
      - -s -w
      - -X github.com/qwexvf/aegis-cli/internal/interface/cli.Version={{ .Version }}
      - -X github.com/qwexvf/aegis-cli/internal/interface/cli.Commit={{ .Commit }}
      - -X github.com/qwexvf/aegis-cli/internal/interface/cli.Date={{ .Date }}

  - id: aegis-yarn
    binary: aegis-yarn
    main: ./cmd/aegis
    env:
      - CGO_ENABLED=1
      - >-
        {{- if eq .Arch "arm64" -}}
        CC=zig cc -target aarch64-linux-gnu
        {{- end -}}
    goos: [linux]
    goarch: [amd64, arm64]
    flags:
      - -tags=nonpm,nobun,nopnpm
    ldflags:
      - -s -w
      - -X github.com/qwexvf/aegis-cli/internal/interface/cli.Version={{ .Version }}
      - -X github.com/qwexvf/aegis-cli/internal/interface/cli.Commit={{ .Commit }}
      - -X github.com/qwexvf/aegis-cli/internal/interface/cli.Date={{ .Date }}

  - id: aegis-pnpm
    binary: aegis-pnpm
    main: ./cmd/aegis
    env:
      - CGO_ENABLED=1
      - >-
        {{- if eq .Arch "arm64" -}}
        CC=zig cc -target aarch64-linux-gnu
        {{- end -}}
    goos: [linux]
    goarch: [amd64, arm64]
    flags:
      - -tags=nonpm,nobun,noyarn
    ldflags:
      - -s -w
      - -X github.com/qwexvf/aegis-cli/internal/interface/cli.Version={{ .Version }}
      - -X github.com/qwexvf/aegis-cli/internal/interface/cli.Commit={{ .Commit }}
      - -X github.com/qwexvf/aegis-cli/internal/interface/cli.Date={{ .Date }}

archives:
  - id: default
    ids: [aegis]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

  - id: core
    ids: [aegis-core]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      aegis-core_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

  - id: per-pm
    ids: [aegis-npm, aegis-bun, aegis-yarn, aegis-pnpm]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: '{{ incpatch .Version }}-dev'

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^Merge'
      - '^chore\(deps\):'
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Documentation
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Other
      order: 999

# Cosign keyless OIDC signing. Signs the checksums file — verifying
# checksums.txt then verifying any artifact against it transitively
# verifies the artifact. Avoids signing every tarball individually.
signs:
  - id: cosign-checksums
    cmd: cosign
    args:
      - sign-blob
      - '--yes'
      - '--output-signature=${signature}'
      - '--output-certificate=${certificate}'
      - '${artifact}'
    artifacts: checksum
    output: true
    certificate: '${artifact}.pem'
    signature: '${artifact}.sig'

# Package-manager distribution (Homebrew tap, Scoop bucket, etc.) is
# intentionally NOT configured. First releases ship as raw GitHub Release
# tarballs only. Add `brews:` / `scoops:` / `nfpms:` blocks once the
# project has a stable cadence and the tap/bucket repos exist.

release:
  github:
    owner: qwexvf
    name: aegis-cli
  draft: false
  prerelease: auto
  header: |
    # aegis-cli {{ .Tag }}

    Supply-chain security CLI for npm / bun / yarn / pnpm.

    ## Verifying releases

    All artifacts are checksummed (`checksums.txt`) and the checksums file
    is signed via cosign keyless OIDC. To verify:

    ```sh
    cosign verify-blob \
      --certificate-identity-regexp 'https://github.com/qwexvf/aegis-cli/.github/workflows/release.yml.*' \
      --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
      --certificate checksums.txt.pem \
      --signature   checksums.txt.sig \
      checksums.txt
    sha256sum -c checksums.txt
    ```

    SLSA build provenance is attached to every artifact and can be
    verified with `gh attestation verify <file> --owner qwexvf`.
  footer: |
    Apache-2.0 — see [LICENSE](https://github.com/qwexvf/aegis-cli/blob/main/LICENSE).
